<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Ghana Trotro Transit</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(15, 23, 42, 0.08);
        --green: #22c55e;
        --green-dark: #15803d;
        --purple: #7c3aed;
        --yellow: #facc15;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }

      .wrap {
        width: min(760px, 100%);
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(137, 34, 197, 0.08);
        border: 1px solid rgba(107, 34, 197, 0.2);
        color: var(--purple);
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .scene {
        position: relative;
        margin: 28px auto 0;
        width: min(420px, 80vw);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .orbit {
        position: absolute;
        inset: 12% 14%;
        border-radius: 50%;
        border: 1px dashed rgba(124, 58, 237, 0.28);
        background: radial-gradient(circle, rgba(124,58,237,0.04), rgba(124,58,237,0.01) 60%, transparent 70%);
      }

      .face {
        position: absolute;
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--border);
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        font-size: 1.8rem;
        font-weight: 800;
        color: var(--yellow);
      }

      .face.top-left { top: 12%; left: 8%; rotate: calc(90deg);}
      .face.top-right { top: 12%; right: 8%; }
      .face.bottom-left { bottom: 18%; left: 18%; }
      .face.bottom-right { bottom: 18%; right: 18%; rotate: calc(90deg);}

      .vehicle-wrap {
        position: relative;
        z-index: 2;
        width: min(250px, 60vw);
        display: grid;
        place-items: center;
      }

      .vehicle-wrap img {
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 20px 24px rgba(148, 163, 184, 0.18));
      }

      h1 {
        margin: 24px 0 12px;
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(2.2rem, 5vw, 4.2rem);
        line-height: 1.04;
        letter-spacing: -0.05em;
      }

      p {
        max-width: 560px;
        margin: 0 auto;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 180px;
        border-radius: 999px;
        padding: 14px 22px;
        border: none;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--green), var(--green-dark));
        color: white;
        box-shadow: 0 16px 30px rgba(34,197,94,0.28);
      }

      .btn.secondary {
        background: white;
        color: var(--text);
        border: 1px solid var(--border);
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 560px) {
        .face {
          width: 48px;
          height: 48px;
          font-size: 1.4rem;
        }

        .scene {
          margin-top: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap" aria-live="polite">
      <div class="badge">404 Error</div>

      <div class="scene" aria-label="A sad trotro vehicle illustration">
        <div class="orbit" aria-hidden="true"></div>
        <div class="face top-left" aria-hidden="true">:(</div>
        <div class="face top-right" aria-hidden="true">:(</div>
        <div class="face bottom-left" aria-hidden="true">:(</div>
        <div class="face bottom-right" aria-hidden="true">:(</div>

        <div class="vehicle-wrap">
          <img src="trotro-vehicle.png" alt="Sad trotro vehicle" />
        </div>
      </div>

      <h1>Page not found</h1>
      <p>
        The page you’re looking for isn’t part of the Ghana Trotro Transit.
        Head back home and find the page you're looking for.
      </p>

      <div class="actions">
        <a class="btn primary" href="https://maps.nxnx.tech">Go Home</a>
        <!--<a class="btn secondary" href="/index.html">Open Main Page</a>-->
      </div>
    </main>
  </body>
</html>
