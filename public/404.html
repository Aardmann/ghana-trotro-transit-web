<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6b21a8" />
    <title>Page Not Found | Ghana Trotro Transit</title>
    <style>
      :root {
        --primary-color: #6b21a8;
        --primary-light: #8b5cf6;
        --primary-dark: #581c87;
        --surface: rgba(255, 255, 255, 0.96);
        --surface-strong: #ffffff;
        --text-color: #1f2937;
        --text-muted: #6b7280;
        --shadow: rgba(88, 28, 135, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 38%, var(--primary-light) 100%);
        color: var(--text-color);
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .error-shell {
        width: min(100%, 520px);
        background: var(--surface);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 26px;
        padding: 28px 28px 24px;
        box-shadow: 0 24px 60px var(--shadow);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 84px;
        height: 84px;
        margin-bottom: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
        color: #fff;
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        box-shadow: 0 12px 28px rgba(107, 33, 168, 0.28);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 5vw, 3.4rem);
        line-height: 1.05;
        letter-spacing: -0.04em;
        color: var(--primary-dark);
      }

      p {
        margin: 14px auto 0;
        max-width: 420px;
        font-size: 1rem;
        line-height: 1.6;
        color: var(--text-muted);
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 26px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 160px;
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 0.96rem;
        font-weight: 700;
        text-decoration: none;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      }

      .button-primary {
        background: linear-gradient(135deg, var(--primary-color), var(--primary-light));
        color: #fff;
        box-shadow: 0 12px 24px rgba(107, 33, 168, 0.2);
      }

      .button-secondary {
        background: rgba(107, 33, 168, 0.08);
        color: var(--primary-dark);
      }

      .button:hover {
        transform: translateY(-1px);
      }

      @media (max-width: 480px) {
        .error-shell {
          padding: 24px 18px 20px;
        }

        .actions {
          flex-direction: column;
        }

        .button {
          width: 100%;
        }
      }
    </style>
    <script type="text/javascript">
      // Preserve SPA route handling for GitHub Pages and app-style routing.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var appPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var route = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var redirectTarget = appPath + '/?/' + route.replace(/&/g, '~and~');

      if (route) {
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          redirectTarget +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <main class="error-shell" aria-live="polite">
      <div class="badge">404</div>
      <h1>Route not found</h1>
      <p>
        This stop isn’t on the map yet, or the link you followed is no longer valid.
      </p>
      <div class="actions">
        <a class="button button-primary" href="/">Back to home</a>
        <a class="button button-secondary" href="/">Open the app</a>
      </div>
    </main>
  </body>
</html>
